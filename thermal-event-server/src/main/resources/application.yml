# =====================================================================
# thermal-event-server 기본 설정
#
# - 비밀번호 등 민감정보는 이 파일에 쓰지 않습니다.
# - 값은 환경변수 또는 .env 파일로 바꿀 수 있습니다.
#   예) ${SERVER_PORT:8080} = 환경변수 SERVER_PORT 가 있으면 그 값, 없으면 8080
# =====================================================================

spring:
  application:
    name: thermal-event-server
  config:
    # .env 파일이 있으면 읽습니다 (없어도 오류 없음).
    # 서버 폴더(thermal-event-server/.env)와 저장소 최상위(camera/.env) 둘 다 찾습니다.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  # TODO(Phase 3): MySQL 접속 설정 (DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD)

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.unitconnect.thermal: ${APP_LOG_LEVEL:INFO}
  file:
    # 로그를 파일로도 남깁니다 (logs 폴더는 Git 에 올라가지 않음)
    name: ${LOG_FILE:logs/thermal-event-server.log}
