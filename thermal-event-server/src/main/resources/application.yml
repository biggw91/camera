# =====================================================================
# thermal-event-server 기본 설정
#
# - 비밀번호 등 민감정보는 이 파일에 쓰지 않습니다.
# - 값은 환경변수 또는 .env 파일로 바꿀 수 있습니다.
#   예) ${SERVER_PORT:8080} = 환경변수 SERVER_PORT 가 있으면 그 값, 없으면 8080
# =====================================================================

spring:
  application:
    name: thermal-event-server
  config:
    # .env 파일이 있으면 읽습니다 (없어도 오류 없음).
    # 서버 폴더(thermal-event-server/.env)와 저장소 최상위(camera/.env) 둘 다 찾습니다.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  # ----- MySQL 접속 (Phase 3) -----
  # 아이디/비밀번호는 여기에 쓰지 않고 .env 의 DB_USERNAME / DB_PASSWORD 로 넣습니다.
  # useSSL=false, allowPublicKeyRetrieval=true 는 같은 PC/사무실 내부 테스트용 설정입니다.
  # TODO(상용 전환): DB 가 다른 서버로 분리되면 SSL 사용으로 변경
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:thermal_event}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      # DB 가 꺼져 있을 때 오래 기다리지 않고 빨리 오류를 알려줍니다
      connection-timeout: 5000

  jpa:
    # 테이블은 Flyway(SQL 파일)로만 만들고, JPA 는 테이블 구조가 맞는지 검사만 합니다
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.unitconnect.thermal: ${APP_LOG_LEVEL:INFO}
  file:
    # 로그를 파일로도 남깁니다 (logs 폴더는 Git 에 올라가지 않음)
    name: ${LOG_FILE:logs/thermal-event-server.log}
